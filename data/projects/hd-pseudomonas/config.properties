# At most 5 genomes per species, the reference assembly first. Pseudomonas has some 400
# species, so even 1 genome each would come close to the memory of the build: this genus
# needs a database of its own, made last.
maxGenomesPerTaxid=5
maxPerTaxidRank=species
refseq.genomesOnly=preferRefFirst
maxDust=500
# Less output than the debug level set for all projects in data/config.properties.
logLevel=info
